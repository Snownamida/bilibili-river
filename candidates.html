<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>常看候选</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--fg:#16181c;--dim:#8a8f98;--line:#e8eaee;
        --accent:#fb7299;--chip:#eceef2;--ok:#1a7f37;--mid:#b26b00}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0f1114;--card:#171a1f;--fg:#e9ebef;--dim:#8b929c;--line:#242830;
          --chip:#1e2228;--ok:#4ade80;--mid:#fbbf24}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;
       padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:10;background:var(--bg);
         padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
  .top{display:flex;align-items:baseline;gap:10px}
  h1{font-size:19px;margin:0}
  .top a{color:var(--dim);font-size:13px;text-decoration:none;margin-right:auto}
  .status{color:var(--dim);font-size:12px;text-align:right;line-height:1.35}
  .bar{display:flex;gap:8px;align-items:center;padding:8px 14px;flex-wrap:wrap}
  select,input[type=search]{background:var(--chip);color:var(--fg);border:0;border-radius:8px;
        padding:7px 10px;font-size:13px}
  input[type=search]{flex:1;min-width:120px}
  .btn{border:0;background:var(--chip);color:var(--fg);border-radius:8px;padding:7px 11px;font-size:13px}
  .hint{padding:6px 16px;color:var(--dim);font-size:12px;line-height:1.5}
  main{padding:0 10px}
  .row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:12px;
       padding:10px;margin-bottom:8px}
  .row input{width:20px;height:20px;margin-top:14px;accent-color:var(--accent);flex:0 0 auto}
  .row img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--chip);flex:0 0 auto}
  .info{min-width:0;flex:1}
  .name{font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .tag{background:var(--chip);color:var(--dim);border-radius:5px;padding:1px 5px;font-size:11px;font-weight:400}
  .stats{color:var(--dim);font-size:12px;margin-top:3px}
  .rate{font-weight:600}
  .rate.hi{color:var(--ok)} .rate.mid{color:var(--mid)}
  .empty{color:var(--dim);text-align:center;padding:60px 20px;font-size:14px}
  footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
         padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
  footer .n{color:var(--dim);font-size:13px;margin-right:auto}
  .primary{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-size:14px}
  @media (min-width:760px){ body{max-width:880px;margin:0 auto} }
</style>
</head>
<body>
<header>
  <div class="top">
    <a href="/">← 河道</a>
    <h1>常看候选</h1>
    <div class="status" id="status">加载中…</div>
  </div>
</header>
<div class="bar">
  <select id="sort">
    <option value="score">按分数</option>
    <option value="rate">按观看率</option>
    <option value="watched">按观看条数</option>
  </select>
  <input type="search" id="q" placeholder="搜名字">
  <button class="btn" id="run">重新分析</button>
</div>
<p class="hint">标准是行为不是内容：近期 80% 看「最近 90 天他发的视频你点开多大比例」，长期 20% 看点攒/投币/收藏/稍后再看。只统计你关注的人。</p>
<main id="list"></main>
<footer>
  <span class="n" id="picked">已选 0</span>
  <button class="btn" id="copy">复制名单</button>
  <button class="primary" id="csv">导出 CSV</button>
</footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let data = {items: [], status: {}};
const picked = new Set();

const pct = x => x == null ? "—" : Math.round(x * 100) + "%";
const when = ts => { const d = new Date(ts*1000); return `${d.getMonth()+1}-${String(d.getDate()).padStart(2,"0")}`; };
const ago = ts => { const s = Math.max(0, Date.now()/1000 - ts);
  return s < 3600 ? `${Math.floor(s/60)} 分钟前` : s < 86400 ? `${Math.floor(s/3600)} 小时前` : `${Math.floor(s/86400)} 天前`; };

function statusText(){
  const st = data.status || {};
  if (st.running) {
    if (st.phase === "sync") return `同步历史… ${st.added || 0} 条`;
    if (st.phase === "follows") return `查关注关系 ${st.done || 0}/${st.total || 0}`;
    if (st.phase === "analyze") return `分析 ${st.done || 0}/${st.total || 0}`;
    return "跑着…";
  }
  if (st.phase === "error") return `<span style="color:#e5484d">失败：${esc(st.error||"")}</span>`;
  if (!data.ts) return "还没跑过";
  return `${ago(data.ts)}分析 · ${data.items.length} 个候选`;
}

function render(){
  $("#status").innerHTML = statusText();
  const q = $("#q").value.trim().toLowerCase();
  let items = data.items.filter(x => !q || (x.uname||"").toLowerCase().includes(q));
  const key = $("#sort").value;
  items = items.slice().sort((a,b) =>
    key === "rate" ? (b.rate ?? -1) - (a.rate ?? -1)
    : key === "watched" ? b.watched - a.watched
    : (b.score ?? 0) - (a.score ?? 0));

  if (!items.length){
    $("#list").innerHTML = `<div class="empty">${data.ts ? "没有匹配的候选" : "还没有数据<br><span style='font-size:12px'>点右上角「重新分析」，大约 5–8 分钟</span>"}</div>`;
    return;
  }
  $("#list").innerHTML = items.map(x => {
    const r = x.rate == null ? "" : `<span class="rate ${x.rate>=0.6?"hi":x.rate>=0.3?"mid":""}">观看率 ${pct(x.rate)}</span>`;
    const up = x.uploads ? `${x.seen ?? x.watched}/${x.uploads}` : "?";
    const sig = x.signals || {};
    const bits = [];
    if (sig.like) bits.push(`赞${sig.like}`);
    if (sig.coin) bits.push(`币${sig.coin}`);
    if (sig.fav) bits.push(`藏${sig.fav}`);
    if (sig.toview) bits.push(`稍后${sig.toview}`);
    const longterm = bits.length ? ` · ${bits.join(" ")}` : "";
    return `<label class="row">
      <input type="checkbox" data-mid="${x.mid}" ${picked.has(String(x.mid))?"checked":""}>
      <img src="${esc(x.face||"")}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="info">
        <div class="name">${esc(x.uname)}${(x.groups||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join("")}</div>
        <div class="stats">看了 ${up} 条投稿 · 共 ${x.watched} 条 · ${r} · 完播 ${pct(x.completion)} · 最近 ${when(x.last)}${longterm}</div>
      </div>
    </label>`;
  }).join("");

  $("#list").querySelectorAll("input[type=checkbox]").forEach(el => {
    el.onchange = () => {
      if (el.checked) picked.add(el.dataset.mid); else picked.delete(el.dataset.mid);
      $("#picked").textContent = `已选 ${picked.size}`;
    };
  });
  $("#picked").textContent = `已选 ${picked.size}`;
}

async function load(){
  try { data = await (await fetch("/api/candidates")).json(); }
  catch(e){ $("#status").textContent = "连不上"; return; }
  if (data.status && data.status.running) setTimeout(load, 3000);
  render();
}

$("#sort").onchange = render;
$("#q").oninput = render;
$("#run").onclick = async () => {
  $("#status").textContent = "启动中…";
  await fetch("/api/candidates/run", {method:"POST"});
  setTimeout(load, 2000);
};
$("#copy").onclick = async () => {
  const names = data.items.filter(x => picked.has(String(x.mid))).map(x => x.uname);
  if (!names.length) return alert("先勾几个");
  try { await navigator.clipboard.writeText(names.join("\n")); alert(`已复制 ${names.length} 个名字`); }
  catch(e){ prompt("手动复制：", names.join("\n")); }
};
$("#csv").onclick = () => {
  const rows = [["名字","mid","看了","投稿数","观看率","完播率","最近观看","现有分组"]];
  for (const x of data.items.filter(x => picked.has(String(x.mid)))){
    rows.push([x.uname, x.mid, x.watched, x.uploads, x.rate ?? "", x.completion ?? "",
               new Date(x.last*1000).toISOString().slice(0,10), (x.groups||[]).join("/")]);
  }
  if (rows.length === 1) return alert("先勾几个");
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff"+csv], {type:"text/csv"}));
  a.download = "bili-changkan.csv"; a.click();
};
load();
</script>
</body>
</html>
