<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分组整理</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--fg:#16181c;--dim:#8a8f98;--line:#e8eaee;
        --accent:#fb7299;--chip:#eceef2}
  @media (prefers-color-scheme: dark){:root{--bg:#0f1114;--card:#171a1f;--fg:#e9ebef;--dim:#8b929c;--line:#242830;--chip:#1e2228}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
       padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
  .top{display:flex;align-items:baseline;gap:10px}
  h1{font-size:19px;margin:0}
  .top a{color:var(--dim);font-size:13px;text-decoration:none;margin-right:auto}
  .status{color:var(--dim);font-size:12px;margin-left:auto}
  nav{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 2px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .chip{border:0;background:var(--chip);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;flex:0 0 auto}
  .chip.on{background:var(--fg);color:var(--bg)}
  .chip .n{opacity:.55;margin-left:4px;font-size:12px}
  .bar{display:flex;gap:8px;padding:8px 14px;align-items:center}
  input[type=search]{flex:1;background:var(--chip);border:0;border-radius:8px;padding:7px 10px;font-size:13px;color:var(--fg)}
  .btn{border:0;background:var(--chip);color:var(--fg);border-radius:8px;padding:7px 11px;font-size:13px}
  main{padding:0 10px}
  .row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px}
  .row input[type=checkbox]{width:20px;height:20px;margin-top:12px;accent-color:var(--accent);flex:0 0 auto}
  .avatar{flex:0 0 auto;line-height:0}
  .row img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--chip)}
  .info{min-width:0;flex:1}
  .name{font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .tag{background:var(--chip);color:var(--dim);border-radius:5px;padding:1px 5px;font-size:11px;font-weight:400}
  .tag.low{color:#b26b00}
  .vids{margin-top:4px;display:flex;flex-direction:column;gap:2px}
  .vid{display:flex;gap:8px;font-size:12px;color:var(--dim);min-width:0;align-items:center}
  .vthumb{width:52px;height:30px;border-radius:4px;object-fit:cover;background:var(--chip);flex:0 0 auto}
  .vid span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .play{margin-left:auto;flex:0 0 auto;color:#8a8f98}
  select{background:var(--chip);color:var(--fg);border:0;border-radius:8px;padding:6px 8px;font-size:12px;max-width:130px}
  footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
         padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
  footer .n{color:var(--dim);font-size:13px;margin-right:auto}
  .primary{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-size:14px}
  @media (min-width:760px){body{max-width:900px;margin:0 auto}}
</style>
</head>
<body>
<header>
  <div class="top">
    <a href="/">← 河道</a>
    <h1>分组整理</h1>
    <span class="status" id="status">加载中…</span>
  </div>
</header>
<nav id="groups"></nav>
<div class="bar">
  <input type="search" id="q" placeholder="搜名字">
  <button class="btn" id="all">全选</button>
  <button class="btn" id="none">全不选</button>
</div>
<main id="list"></main>
<footer>
  <span class="n" id="picked">已选 0</span>
  <button class="primary" id="apply">应用选中</button>
</footer>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n >= 1e8 ? (n/1e8).toFixed(1)+"亿" : n >= 1e4 ? (n/1e4).toFixed(1)+"万" : String(n);
let data = {items: [], counts: {}, total: 0};
let cur = "all";
const selected = new Map();   // mid -> group

function groups(){
  const names = Object.keys(data.counts).sort((a,b) => data.counts[b]-data.counts[a]);
  return names;
}

function renderChips(){
  let html = `<button class="chip ${cur==="all"?"on":""}" data-g="all">全部<span class="n">${data.total}</span></button>`;
  for (const g of groups())
    html += `<button class="chip ${cur===g?"on":""}" data-g="${esc(g)}">${esc(g)}<span class="n">${data.counts[g]}</span></button>`;
  $("#groups").innerHTML = html;
  $("#groups").querySelectorAll(".chip").forEach(el => el.onclick = () => { cur = el.dataset.g; load(); });
}

function render(){
  const q = $("#q").value.trim().toLowerCase();
  let items = data.items.filter(x => !q || (x.uname||"").toLowerCase().includes(q));
  $("#status").textContent = `共 ${data.total} 人 · 当前 ${items.length}`;
  const opts = g => groups().map(n => `<option ${n===g?"selected":""}>${esc(n)}</option>`).join("");
  $("#list").innerHTML = items.map(x => {
    const g = selected.get(String(x.mid)) ?? x.group;
    const low = (x.confidence ?? 1) < 0.5;
    return `<div class="row" data-mid="${x.mid}">
      <input type="checkbox" ${selected.has(String(x.mid))?"checked":""}>
      <a class="avatar" href="https://space.bilibili.com/${x.mid}" target="_blank" rel="noopener">
        <img src="${esc(x.face||"")}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.visibility='hidden'">
      </a>
      <div class="info">
        <div class="name">${esc(x.uname)}${low?'<span class="tag low">低置信</span>':''}</div>
        <div class="vids">${(x.videos&&x.videos.length?x.videos:[{t:x.reason||""}]).map(v=>`<div class="vid">${v.c?`<img class="vthumb" loading="lazy" referrerpolicy="no-referrer" src="${esc(v.c)}" onerror="this.style.display='none'">`:""}<span>${esc(v.t||"")}</span>${v.p!=null?`<span class="play">${fmt(v.p)}</span>`:""}</div>`).join("")}</div>
      </div>
      <select data-mid="${x.mid}">${opts(g)}</select>
    </div>`;
  }).join("");
  $("#list").querySelectorAll("select").forEach(sel => sel.onchange = () => {
    selected.set(sel.dataset.mid, sel.value);
    refreshCount();
  });
  $("#list").querySelectorAll("input[type=checkbox]").forEach(cb => {
    cb.onchange = () => {
      const mid = cb.closest(".row").dataset.mid;
      if (cb.checked) selected.set(mid, cb.closest(".row").querySelector("select").value);
      else selected.delete(mid);
      refreshCount();
    };
  });
  refreshCount();
}
function refreshCount(){ $("#picked").textContent = `已选 ${selected.size}`; }

async function load(){
  $("#list").innerHTML = `<div style="color:#8a8f98;text-align:center;padding:40px">加载中…</div>`;
  const r = await fetch("/api/tidy?grp=" + encodeURIComponent(cur));
  if (!r.ok){ $("#status").textContent = "加载失败"; return; }
  const d = await r.json();
  data.items = d.items; data.counts = d.counts; data.total = d.total;
  renderChips(); render();
}

$("#q").oninput = render;
$("#all").onclick = () => {
  $("#list").querySelectorAll(".row").forEach(row => {
    row.querySelector("input").checked = true;
    selected.set(row.dataset.mid, row.querySelector("select").value);
  });
  refreshCount();
};
$("#none").onclick = () => { $("#list").querySelectorAll("input").forEach(cb => cb.checked = false); selected.clear(); refreshCount(); };

$("#apply").onclick = async () => {
  if (!selected.size) return alert("先勾几个");
  const items = [...selected].map(([mid, group]) => ({mid, group}));
  if (!confirm(`把 ${items.length} 个 UP 加到对应分组？只加不删。`)) return;
  $("#apply").textContent = "提交中…";
  try {
    const r = await fetch("/api/tidy/apply", {method:"POST", headers:{"Content-Type":"application/json"},
                                              body: JSON.stringify({items})});
    const d = await r.json();
    if (!d.ok) return alert(d.msg || "失败");
    alert(`已加入 ${d.moved} 个${d.created && d.created.length ? "，新建了：" + d.created.join("、") : ""}`);
    selected.clear(); load();
  } finally { $("#apply").textContent = "应用选中"; }
};
load();
</script>
</body>
</html>
